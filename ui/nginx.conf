server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS. Resolving per request (via the variable) lets the UI start even if rockets-api isn't up yet.
    resolver 127.0.0.11 valid=10s;
    set $rockets_api http://rockets-api:8088;

    # /api/rockets?sortBy=… → http://rockets-api:8088/rockets?sortBy=… (same origin for the browser, so no CORS needed)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $rockets_api;
    }

    location / {
        try_files $uri /index.html;
    }
}
